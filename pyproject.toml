[project]
name = "audiobook-bot"
version = "0.1.0"
description = "Local Ukrainian TTS (HolosTTS) for the audiobook bot"
requires-python = ">=3.12,<3.15"
dependencies = [
    "accentuk==0.3.3",
    "holos-tts-mlx>=0.1",
    "ipa-uk",
    "lameenc>=1.9.0",
    "num2words>=0.5.14",
    "numpy>=2.4.6",
    "requests>=2.34.2",
]

[tool.uv.sources]
ipa-uk = { git = "https://github.com/patriotyk/ipa-uk.git" }

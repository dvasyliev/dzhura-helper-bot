[project]
name = "dzhura-helper-bot"
version = "0.3.0"
description = "Python side of the Dzhura bot: audiobook voicing and karaoke"
requires-python = ">=3.12,<3.15"
dependencies = [
    "accentuk==0.3.3",
    "audio-separator[cpu]>=0.48",
    "audioread>=3.1.0",
    "ctc-forced-aligner",
    "docling>=2.153.0",
    "docling-core>=2.108.0",
    "en-core-web-sm",
    "holos-tts-mlx>=0.1",
    "ipa-uk",
    "lameenc>=1.9.0",
    "librosa>=1.0.1",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.6.8",
    "mlx-whisper>=0.4.3",
    "num2words>=0.5.14",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-uk>=2.4.1.1.1663094765",
    "pypdfium2>=5.15.2",
    "requests>=2.34.2",
    "spacy>=3.8.18",
    "torch>=2.15.0",
    "yt-dlp>=2026.11.23",
]

[tool.uv.sources]
ipa-uk = { git = "https://github.com/patriotyk/ipa-uk.git" }
ctc-forced-aligner = { git = "https://github.com/MahmoudAshraf97/ctc-forced-aligner.git", rev = "277720ff832f6ec92bc97e32c7a6eda5dc466277" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "deptry>=0.25.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff>=0.17.6",
    "vulture>=2.16",
]

[tool.deptry]
# Scripts in src/features/*/scripts import their neighbours and subpackages (uk, tts) by bare name.
known_first_party = [
    "sentences", "tts", "uk", "voice", "pdf_book", "pdf_convert",
    "align", "countin", "fetch", "karaoke", "listen", "lyrics", "render", "separate", "subtitles", "verify",
    "checks", "chunk_check", "glossary_candidates", "language", "typography", "ukrainian",
]
# audioread: audio-separator needs it but does not declare it. misaki[en] and en-core-web-sm: mlx-audio's Kokoro
# needs them for English but does not declare them (glossary_candidates.py loads en-core-web-sm by name).
# pymorphy3-dicts-uk: the Ukrainian dictionary pymorphy3 loads for lang="uk". pytest: imported only by the tests.
per_rule_ignores = { DEP002 = ["audioread", "misaki", "en-core-web-sm", "pymorphy3-dicts-uk"], DEP004 = ["pytest"] }

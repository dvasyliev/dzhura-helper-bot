# Runs on GitHub what the end-of-turn hook runs locally: every check in .claude/harness.json
# (npm run check), and commitlint on the commit messages of a pull request. The Python side needs
# Apple Silicon (MLX), so the checks run on a macOS arm64 runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      # What the tests need outside the packages, as SETUP.md installs it: ffmpeg with libass for
      # karaoke, the stress model and the Wiktionary stress index for audiobook (cached, ~700 MB).
      - run: brew tap homebrew-ffmpeg/ffmpeg && brew install homebrew-ffmpeg/ffmpeg/ffmpeg
      - uses: actions/cache@v6
        id: stress
        with:
          path: |
            ~/.cache/accentuk
            ~/.cache/audiobook-bot
          key: stress-${{ hashFiles('uv.lock', 'src/features/audiobook/scripts/uk/stress_index.py') }}
      - if: steps.stress.outputs.cache-hit != 'true'
        run: |
          uv run accentuk download --light
          uv run python src/features/audiobook/scripts/uk/stress_index.py
      - run: npm run check

  commitlint:
    # Dependabot's commit bodies hold release notes with long lines that commitlint rejects.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
